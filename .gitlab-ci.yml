# GitLab Pages — déploie le dossier /legal automatiquement
# URLs : https://<username>.gitlab.io/<repo>/privacy.html
#         https://<username>.gitlab.io/<repo>/terms.html

pages:
  stage: deploy
  script:
    - mkdir public
    - cp legal/*.html public/
  artifacts:
    paths:
      - public
  only:
    - main
